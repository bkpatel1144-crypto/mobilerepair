<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="aim">
  <!--
    The "aim" wordmark reduced to its first letter, because a favicon is read at 16px where three
    letters become a smudge. Drawn as geometry rather than a <text> element on purpose: text
    renders with whatever font the viewer happens to have, so the same icon would differ between
    a Windows tab, a macOS bookmark bar and an Android home screen.

    A single-storey lowercase "a" — a ring plus a stem, both the same height. The double-storey
    form's aperture closes up and reads as an "o" once it is small enough; and the stem must not
    rise above the bowl, or the ascender turns the glyph into a "d" (which is what the first
    attempt did).

    Full-bleed teal (#0d9488, the brand primary and the manifest's theme_color) with the glyph
    inside the centre 60%, which keeps it inside the safe zone when Android crops it to a circle
    for a maskable icon.
  -->
  <rect width="64" height="64" rx="14" fill="#0d9488" />
  <g fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round">
    <circle cx="27" cy="36" r="11.5" />
  </g>
  <rect x="38" y="21" width="7" height="30" rx="3.5" fill="#fff" />
</svg>
