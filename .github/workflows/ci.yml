name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A new push supersedes the run in progress for the same branch — no point burning minutes
  # verifying a commit that has already been replaced.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Ordered cheapest-and-most-specific first, so a failure names the actual problem instead
      # of surfacing as a confusing build error further down.
      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Tests
        run: npm test

      # `npm run build` is `tsc -b && vite build`, so this covers typechecking too. The dummy
      # Firebase values exist because `src/lib/firebase.ts` reads them at module load and throws
      # on a missing key; nothing here contacts Firebase, so any well-formed value will do.
      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ci-placeholder
          VITE_FIREBASE_AUTH_DOMAIN: ci.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: ci-project
          VITE_FIREBASE_STORAGE_BUCKET: ci-project.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          VITE_FIREBASE_APP_ID: '1:000000000000:web:0000000000000000000000'
          VITE_FIREBASE_DATABASE_ID: mobilerepairing
